{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<div class="auth-card card border-0 shadow-sm p-4 mx-auto"><h1 class="h3 fw-bold">Welcome back</h1><p class="text-muted">Log in to view your saved recommendations.</p><form method="post"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-success w-100">Login</button></form><p class="small mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
