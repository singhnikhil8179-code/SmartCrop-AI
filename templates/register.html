{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<div class="auth-card card border-0 shadow-sm p-4 mx-auto"><h1 class="h3 fw-bold">Create your account</h1><p class="text-muted">Save and review your crop recommendations.</p><form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required maxlength="80"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><button class="btn btn-success w-100">Register</button></form></div>{% endblock %}
